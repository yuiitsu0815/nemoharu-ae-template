name: Notion Sync

# README.md / DOCUMENT.md が main に push されたら、対応する Notion ページを書き換える。
# 必要な Secret: NOTION_TOKEN（Notion の内部インテグレーションのトークン）
#   未設定のあいだは何もせず成功扱いで終わる。
# 対象ページは scripts/notion-sync/targets.json。各ページを Notion 側でインテグレーションに接続しておくこと。

on:
  push:
    branches: [ main ]
    paths:
      - README.md
      - DOCUMENT.md
      - scripts/notion-sync/**
      - .github/workflows/notion-sync.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: scripts/notion-sync
        run: npm ci

      - name: Sync to Notion
        working-directory: scripts/notion-sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node sync.mjs
