name: Discord Notify

# main へ push されるたびに、更新内容を Discord に投稿する。
# 送信先は リポジトリ Secret: DISCORD_WEBHOOK（Discordのチャンネル Webhook URL）。

on:
  push:
    branches: [ main ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed files
        id: diff
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -20)
          if [ -z "$FILES" ]; then FILES="(初回コミット / 差分なし)"; fi
          {
            echo "files<<__EOF__"
            echo "$FILES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_SHA: ${{ github.sha }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          FILES: ${{ steps.diff.outputs.files }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          PAYLOAD=$(jq -n \
            --arg title "🎬 AEテンプレ更新: $REPO" \
            --arg desc "$COMMIT_MSG" \
            --arg url "$COMMIT_URL" \
            --arg author "$AUTHOR" \
            --arg sha "$SHORT_SHA" \
            --arg files "$FILES" \
            '{
              username: "AE Template Bot",
              embeds: [ {
                title: $title,
                description: $desc,
                url: $url,
                color: 5793266,
                fields: [
                  { name: "変更ファイル", value: ("```\n" + $files + "\n```") },
                  { name: "author", value: $author, inline: true },
                  { name: "commit", value: $sha, inline: true }
                ]
              } ]
            }')
          curl -sS -H "Content-Type: application/json" -X POST \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK"
